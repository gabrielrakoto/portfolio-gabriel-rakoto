<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <feColorMatrix in="SourceGraphic" type="matrix" values="0.55 0 0 0 0  0 0.55 0 0 0  0 0 0.55 0 0  0 0 0 1 0" result="svc-glitch-light"></feColorMatrix>

    <feColorMatrix in="SourceGraphic" type="matrix" values="0.15 0 0 0 0  0 0.15 0 0 0  0 0 0.15 0 0  0 0 0 1 0" result="svc-glitch-dark"></feColorMatrix>
    <feOffset in="svc-glitch-dark" dx="4" dy="-1" result="svc-glitch-dark-off"></feOffset>
    <feBlend in="svc-glitch-light-off" in2="svc-glitch-dark-off" mode="screen" result="svc-glitch-chroma"></feBlend>
    <feBlend in="svc-glitch-chroma" in2="svc-glitch-displaced" mode="screen"></feBlend>
  </filter>
</svg>
